<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#F58529"/>
      <stop offset="35%" stop-color="#DD2A7B"/>
      <stop offset="70%" stop-color="#8134AF"/>
      <stop offset="100%" stop-color="#515BD4"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="194" height="54" rx="8" fill="#0D0221"
        stroke="url(#ig)" stroke-width="2" stroke-dasharray="12 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="100" y="36" text-anchor="middle" font-family="monospace"
        font-size="16" font-weight="bold" fill="url(#ig)">INSTAGRAM</text>
</svg>
